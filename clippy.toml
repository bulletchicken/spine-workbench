# Lint rules shared by every crate. The engine runs the same code natively
# and in the browser, and its results must match bit for bit, so:
#  - no clock, threads, files, environment or network in engine crates
#    (only command-line and chores allow files and environment, each with
#    a crate-level allow that says why);
#  - no std float transcendentals: their native results come from the
#    system maths library and can differ from wasm in the last bit. Use
#    the libm crate instead. mul_add is out too, so no fused rounding.

disallowed-types = [
  { path = "std::time::Instant", reason = "no clock in the engine; Instant::now panics on wasm32" },
  { path = "std::time::SystemTime", reason = "no clock in the engine" },
  { path = "std::fs::File", reason = "no files in the engine" },
  { path = "std::fs::OpenOptions", reason = "no files in the engine" },
  { path = "std::net::TcpStream", reason = "no network" },
  { path = "std::net::TcpListener", reason = "no network" },
  { path = "std::net::UdpSocket", reason = "no network" },
  { path = "std::thread::Builder", reason = "no threads in the engine" },
]

disallowed-methods = [
