[package]
name = "wasm-bridge"
description = "The only crate that knows about the browser: thin exports, no logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib for the browser; rlib so native tests can link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
shapes = { path = "../shapes" }
spine-readings = { path = "../spine-readings" }
auto-pass = { path = "../auto-pass" }
case-checks = { path = "../case-checks" }
case-file = { path = "../case-file" }
film-geometry = { path = "../film-geometry" }
film-reader = { path = "../film-reader" }
implant-layout = { path = "../implant-layout" }
joint-fit = { path = "../joint-fit" }
load-bench = { path = "../load-bench" }
made-up-spines = { path = "../made-up-spines" }
scorekeeper = { path = "../scorekeeper" }
toolbox = { path = "../toolbox" }
trained-finder = { path = "../trained-finder" }
js-sys.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true
