# the browser build never does.
test-support = []

[dependencies]
shapes = { path = "../shapes" }
darkroom = { path = "../darkroom" }
dicom-object.workspace = true
flate2.workspace = true
half.workspace = true
hayro-jpeg2000.workspace = true
jpeg-decoder.workspace = true
miniz_oxide.workspace = true
png.workspace = true
thiserror.workspace = true

[dev-dependencies]
dicom-toolkit-jpeg2000.workspace = true
jpeg-encoder.workspace = true
proptest.workspace = true
pure_jpegls.workspace = true
