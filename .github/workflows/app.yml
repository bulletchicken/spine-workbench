# The app: the engine is built for the browser once, then the web checks
# and the browser tests run against that one build.

name: app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces its older run; every push to main
# runs to the end.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
      - name: The wasm-bindgen version in Cargo.lock
        id: bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bindgen-cli
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.bindgen.outputs.version }}
      - name: The matching wasm-bindgen command-line tool
        if: steps.bindgen-cli.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "=${{ steps.bindgen.outputs.version }}" --locked
      - name: Crate and tool versions match
        run: cargo chores versions
      - name: Release engine
        run: cargo chores wasm --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine
          path: app/src/engine-room/wasm-build/
          if-no-files-found: error
          retention-days: 7

  web:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: app/src/engine-room/wasm-build/
      - name: Types
        run: pnpm exec tsc -b app proving-ground
      - name: Lint, network ban and import boundaries
        run: pnpm exec eslint . --max-warnings 0
      - name: App unit tests
        run: pnpm --filter ./app test
      - name: Parity with the real engine
        run: pnpm --filter ./proving-ground test

  browser:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: app/src/engine-room/wasm-build/
      - name: The Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter ./proving-ground exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium and WebKit
        run: pnpm --filter ./proving-ground exec playwright install --with-deps chromium webkit
      - name: Production build with the engine built above
        run: pnpm build
        env:
          ENGINE_PREBUILT: '1'
      - name: Build scan and browser tests
        run: pnpm --filter ./proving-ground browser
        env:
          BROWSERS: chromium,webkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: proving-ground/test-results/
          retention-days: 7
