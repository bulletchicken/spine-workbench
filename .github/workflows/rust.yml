# The engine: formatting, lints, native tests, the browser build check and
# the repository checks that keep the crates honest.

name: rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces its older run; every push to main
# runs to the end.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Native tests
        run: cargo test --workspace
      - name: The bridge builds for the browser
        run: cargo check -p wasm-bridge --target wasm32-unknown-unknown
      - name: Seams between crates
        run: cargo chores seams
      - name: Generated shapes match the Rust shapes
        run: cargo chores shapes --check
      - name: Every path in MAP.md exists
        run: cargo chores map --check
